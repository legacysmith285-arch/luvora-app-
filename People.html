<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore People - Luvora ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f8;
      color: #222;
    }

    header {
      background: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      color: #e91e63;
      font-size: 25px;
      font-weight: bold;
    }

    .back {
      color: #e91e63;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    #people {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .avatar {
      width: 100%;
      height: 230px;
      background: #ffe0eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      padding: 18px;
    }

    .name {
      font-size: 21px;
      font-weight: bold;
    }

    .details {
      color: #777;
      margin: 7px 0;
    }

    .bio {
      margin: 12px 0;
      line-height: 1.5;
    }

    .looking {
      display: inline-block;
      background: #fff0f5;
      color: #e91e63;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .connect {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      color: #777;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Luvora ❤️</div>
  <a class="back" href="Index.html">Home</a>
</header>

<div class="container">

  <h1>Explore People 🌍</h1>

  <p class="subtitle">
    Discover people and make meaningful connections.
  </p>

  <div id="people">
    <div id="message">Loading people...</div>
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://krfitqabsearnidegdzx.supabase.co";

  const SUPABASE_KEY =
    "sb-publishable-ZmozR-wotOGpWRGoVxjufA-xIlmfmy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const peopleContainer =
    document.getElementById("people");

  async function loadPeople() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .limit(50);

    if (error) {
      peopleContainer.innerHTML =
        `<div id="message">
          Could not load profiles.<br>
          ${error.message}
        </div>`;
      return;
    }

    const people = user
      ? data.filter(profile => profile.id !== user.id)
      : data;

    if (!people.length) {
      peopleContainer.innerHTML =
        `<div id="message">
          No other profiles yet.<br>
          Invite people to join Luvora ❤️
        </div>`;
      return;
    }

    peopleContainer.innerHTML = "";

    people.forEach(profile => {

      const card = document.createElement("div");
      card.className = "card";

      let photo = "👤";

      if (profile.avatar_url) {
        photo =
          `<img src="${escapeHtml(profile.avatar_url)}"
                alt="Profile photo"
                onerror="this.style.display='none'">`;
      }

      const age =
        profile.age ? `${profile.age} years` : "";

      const country =
        profile.country || "Country not added";

      const details =
        [age, country]
          .filter(Boolean)
          .join(" • ");

      const looking =
        profile.looking_for || "Looking for connections";

      card.innerHTML = `
        <div class="avatar">${photo}</div>

        <div class="info">

          <div class="name">
            ${escapeHtml(profile.display_name || "Luvora Member")}
          </div>

          <div class="details">
            ${escapeHtml(details)}
          </div>

          <div class="bio">
            ${escapeHtml(
              profile.bio || "This person hasn't added a bio yet."
            )}
          </div>

          <div class="looking">
            ${escapeHtml(looking)}
          </div>

          <button
            class="connect"
            onclick="connectWith('${profile.id}')">
            ❤️ Connect
          </button>

        </div>
      `;

      peopleContainer.appendChild(card);
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
async function connectWith(profileId) {
  try {
    const {
      data: { user },
      error: authError
    } = await supabaseClient.auth.getUser();

    if (authError || !user) {
      alert("Please log in first.");
      window.location.href = "login.html";
      return;
    }

    if (user.id === profileId) {
      alert("You cannot connect with yourself.");
      return;
    }

    const { error } = await supabaseClient
      .from("connections")
      .insert({
        sender_id: user.id,
        receiver_id: profileId,
        status: "pending"
      });

    if (error) {
      if (error.code === "23505") {
        alert("You already sent a connection request. ❤️");
      } else {
        console.error(error);
        alert("Could not send the connection request. Please try again.");
      }
      return;
    }

    alert("Connection request sent! ❤️");
  } catch (error) {
    console.error(error);
    alert("Something went wrong. Please try again.");
  }
}
  

  loadPeople();

</script>

</body>
</html>
