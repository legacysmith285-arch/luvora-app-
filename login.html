<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Luvora</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #e91e63;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .signup,
    .back {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #e91e63;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">Luvora ❤️</div>

  <h1>Welcome Back</h1>

  <p class="subtitle">
    Log in to continue connecting with the world.
  </p>

  <form id="loginForm">

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">Log In</button>

  </form>

  <div id="message"></div>

  <div class="signup">
    Don't have an account?
    <a href="register.html">Create one</a>
  </div>

  <div class="back">
    <a href="Index.html">← Back to Luvora</a>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://krfitqabsearnidegdzx.supabase.co";
  const SUPABASE_KEY = " sb_publishable_ZmozR_WotOGpWRGoVXjUfA_X-iLMfMy";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent = "Login successful! ❤️";

    setTimeout(() => {
      window.location.href = "Index.html";
    }, 1000);
  });
</script>

</body>
</html>
