<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Luvora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #e91e63;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #e91e63;
      text-decoration: none;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .signup a {
      color: #e91e63;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Luvora ❤️</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Log in to continue connecting with the world.
    </p>

    <form>
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <p class="signup">
      Don't have an account?
      <a href="register.html">Create one</a>
    </p>

    <a class="back" href="Index.html">← Back to Luvora</a>

  </div>

</body>
</html>
