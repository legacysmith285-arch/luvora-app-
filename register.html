<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Luvora ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #e91e63;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    a {
      color: #e91e63;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">Luvora ❤️</div>

  <h1>Join Luvora</h1>

  <p class="subtitle">
    Create your account and meet people around the world.
  </p>

  <form id="registerForm">

    <label for="name">Your name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your name"
      required
    >

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="At least 6 characters"
      minlength="6"
      required
    >

    <label for="country">Country</label>
    <input
      type="text"
      id="country"
      placeholder="e.g. Nigeria"
      required
    >

    <button type="submit">Create Account ❤️</button>

  </form>

  <div id="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Log in</a>
  </div>

  <div class="login">
    <a href="Index.html">← Back to Luvora</a>
  </div>

</div>

<script>
  const SUPABASE_URL =
    "https://krfitqabsearnidegdzx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ZmozR_WotOGpWRGoVXjUfA_X-iLMfMy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const form = document.getElementById("registerForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const country =
      document.getElementById("country").value.trim();

    message.textContent = "Creating your account...";

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            name: name,
            country: country
          }
        }
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent =
      "Account created successfully! ❤️";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
  });
</script>

</body>
</html>
