<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luvora Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
    }

    header {
      background: #ff4f81;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-decoration: none;
      color: #ff4f81;
      padding: 15px;
      background: white;
      font-weight: bold;
    }

    #messages {
      height: calc(100vh - 145px);
      overflow-y: auto;
      padding: 15px;
      padding-bottom: 80px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 18px;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #ff4f81;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .theirs {
      margin-right: auto;
      background: white;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    .time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
    }

    #sendButton {
      border: none;
      background: #ff4f81;
      color: white;
      padding: 0 18px;
      border-radius: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    💕 Luvora Chat
  </header>

  <a class="back" href="connections.html">
    ← Back to Connections
  </a>

  <div id="messages">
    <p>Loading chat...</p>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button id="sendButton">
      Send
    </button>
  </div>

  <script>
    const SUPABASE_URL = "https://krfitqabsearnidegdzx.supabase.co";

    const SUPABASE_KEY = "sb_publishable_ZmorR_WotOGpWRGovxjUfA_x-iLMfmy";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let conversationId = null;
    let chatChannel = null;

    const messagesBox = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");


    async function startChat() {

      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();

      if (error || !user) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      const params = new URLSearchParams(window.location.search);

      conversationId = params.get("conversation");

      if (!conversationId) {
        messagesBox.innerHTML =
          "<p>No conversation was selected.</p>";
        return;
      }

      await verifyMembership();

      await loadMessages();

      subscribeToMessages();
    }


    async function verifyMembership() {

      const { data, error } = await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq("conversation_id", conversationId)
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (error || !data) {
        console.error(error);
        messagesBox.innerHTML =
          "<p>You don't have access to this conversation.</p>";
        return;
      }
    }


    async function loadMessages() {

      const { data, error } = await supabaseClient
        .from("messages")
        .select("*")
        .eq("conversation_id", conversationId)
        .order("created_at", {
          ascending: true
        });

      if (error) {
        console.error(error);

        messagesBox.innerHTML =
          "<p>Could not load messages.</p>";

        return;
      }

      messagesBox.innerHTML = "";

      data.forEach(message => {
        displayMessage(message);
      });

      scrollToBottom();
    }


    function displayMessage(message) {

      const messageDiv = document.createElement("div");

      messageDiv.className =
        "message " +
        (message.sender_id === currentUser.id
          ? "mine"
          : "theirs");

      const text = document.createElement("div");

      text.textContent = message.message;

      const time = document.createElement("div");

      time.className = "time";

      time.textContent =
        new Date(message.created_at).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

      messageDiv.appendChild(text);
      messageDiv.appendChild(time);

      messagesBox.appendChild(messageDiv);
    }


    async function sendMessage() {

      const message = messageInput.value.trim();

      if (!message || !conversationId || !currentUser) {
        return;
      }

      sendButton.disabled = true;

      const { error } = await supabaseClient
        .from("messages")
        .insert({
          conversation_id: conversationId,
          sender_id: currentUser.id,
          message: message
        });

      if (error) {
        console.error(error);
        alert("Message could not be sent.");
      } else {
        messageInput.value = "";
      }

      sendButton.disabled = false;

      messageInput.focus();
    }


    function subscribeToMessages() {

      chatChannel = supabaseClient
        .channel("chat-" + conversationId)

        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
              "conversation_id=eq." + conversationId
          },

          payload => {

            displayMessage(payload.new);

            scrollToBottom();
          }
        )

        .subscribe();
    }


    function scrollToBottom() {

      messagesBox.scrollTop =
        messagesBox.scrollHeight;
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );


    window.addEventListener(
      "beforeunload",
      () => {

        if (chatChannel) {
          supabaseClient.removeChannel(chatChannel);
        }

      }
    );


    startChat();
  </script>

</body>
</html>
